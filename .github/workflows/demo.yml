name: Test workflow

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  inputs: 
    num1:
      description: 'First number'
      required: true
      default: 0
    num2:
      description: 'Second number'
      required: true
      default: 0
env: 
  platform: "Ubuntu"

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      sum: num1 + num2
    steps:
      - uses: actions/checkout@v4
      - name: Sum two numbers
        id: sum
        run:  |
          echo "sum ${{env.sum}}"
      